\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cstrong>Driver\u003c/strong>\u003c/td>\u003ctd>\u003ca href=\"#ticket-road\">07 Road reports aur prompts\u003c/a>\u003c/td>\u003ctd>Report/prompt APIs hain. Fresh fix, stable retry aur policy integration baaki.\u003c/td>\u003ctd>Nearby feed, Still there? aur safe 10-second prompt.\u003c/td>\u003ctd>\u003cstrong>Dono\u003c/strong>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cstrong>Manager \u00b7 Driver\u003c/strong>\u003c/td>\u003ctd>\u003ca href=\"#ticket-office\">08 Manager cards aur driver help\u003c/a>\u003c/td>\u003ctd>Action APIs hain. Driver reply aur same-card linkage verify karni hai.\u003c/td>\u003ctd>Call result, handled, snooze aur reply wiring.\u003c/td>\u003ctd>\u003cstrong>Dono \u00b7 mainly mobile\u003c/strong>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cstrong>Owner\u003c/strong>\u003c/td>\u003ctd>\u003ca href=\"#ticket-followup\">09A Arrival promise\u003c/a>\u003c/td>\u003ctd>Versioned promise API aur on-time reporting release branch mein.\u003c/td>\u003ctd>Promise form, version history aur drilldown.\u003c/td>\u003ctd>\u003cstrong>Mobile\u003c/strong>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cstrong>Owner\u003c/strong>\u003c/td>\u003ctd>\u003ca href=\"#ticket-followup\">09B Trip costs aur margin\u003c/a>\u003c/td>\u003ctd>Cost-closure API aur margin readers release branch mein. Source reconciliation proof baaki.\u003c/td>\u003ctd>Trip-cost form, evidence aur margin detail.\u003c/td>\u003ctd>\u003cstrong>Mobile + data QA\u003c/strong>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cstrong>Owner\u003c/strong>\u003c/td>\u003ctd>\u003ca href=\"#ticket-followup\">09C Report distribution\u003c/a>\u003c/td>\u003ctd>Email/WhatsApp preference aur delivery-history code release branch mein. Provider setup baaki.\u003c/td>\u003ctd>Channel opt-ins, history aur error states.\u003c/td>\u003ctd>\u003cstrong>Mobile + release setup\u003c/strong>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cstrong>Owner\u003c/strong>\u003c/td>\u003ctd>\u003ca href=\"#ticket-followup\">09D Crew/plant/lane audiences\u003c/a>\u003c/td>\u003ctd>Target/member APIs release branch mein. Live plant/lane membership ko source evidence chahiye.\u003c/td>\u003ctd>Audience picker aur recipient preview.\u003c/td>\u003ctd>\u003cstrong>Dono\u003c/strong>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cstrong>Driver \u00b7 Owner\u003c/strong>\u003c/td>\u003ctd>\u003ca href=\"#ticket-evidence\">09E Paper evidence aur reminders\u003c/a>\u003c/td>\u003ctd>Taxonomy, bill pairing aur evidence readers hain. Per-type cross-check aur accuracy proof baaki.\u003c/td>\u003ctd>Disagreement, expiry aur actionable retake screens.\u003c/td>\u003ctd>\u003cstrong>Dono\u003c/strong>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cstrong>Driver \u00b7 Field Agent \u00b7 Manager \u00b7 Owner\u003c/strong>\u003c/td>\u003ctd>\u003ca href=\"#qa\">10 QA aur pilot\u003c/a>\u003c/td>\u003ctd>Focused checks available. Production evidence aur rollout gates baaki.\u003c/td>\u003ctd>Real device end-to-end flow, permissions aur OEM testing.\u003c/td>\u003ctd>\u003cstrong>Dono\u003c/strong>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003cstrong>Field Agent\u003c/strong>\u003c/td>\u003ctd>\u003ca href=\"#ticket-field-agent\">Field Agent org aur fuel flow\u003c/a>\u003c/td>\u003ctd>Org membership, vehicle scope aur fuel submission available hain.\u003c/td>\u003ctd>Org switch \u2192 vehicle select \u2192 fuel submit ka device check.\u003c/td>\u003ctd>\u003cstrong>QA\u003c/strong>\u003c/td>\u003c/tr>\n    \u003c/tbody>\n  \u003c/table>\u003c/div>\n  \u003cdiv class=\"panel\">\n    \u003ch3>Already usable in source\u003c/h3>\n    \u003cp>Login, assigned truck, historical GPS trips, fuel capture/history, documents, support, SOS, manual stop reason, ERP trip/POD actions, field-agent org selection, team access, messaging/voice notes, owner report aur manual crew handover ke active paths milte hain. Inko regression checklist mein rakho. Crew, cards aur baaki v2 calls ka end-to-end sign-off 01 ke baad karo.\u003c/p>\n    \u003cp>\u003cstrong>Phase 2 scope\u003c/strong> mein Ferrostar/MapLibre, turn-by-turn, destination search without ERP, alternate truck routes, route corridor packs, fused guidance, learned ETA aur predictive corridor jam prompts rahenge. Plant notifications, manual road reports aur shared prompt UI Phase 1 mein included hain.\u003c/p>\n  \u003c/div>\n\u003c/section>\u003c/section>\n\u003csection id=\"branches\" class=\"route-view\" hidden>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>Release branches\u003c/h1>\u003cp>Kaunsa code release mein hai aur mobile reference kahan milega.\u003c/p>\u003c/div>\u003c/header>\u003csection>\n  \u003cp>Neeche branch aur commit se verify kar sakte ho ki kaunsa patch reuse ho sakta hai aur kaunsa code current main mein already hai.\u003c/p>\n  \u003cdiv class=\"table-scroll\">\u003ctable>\n    \u003cthead>\u003ctr>\u003cth scope=\"col\">Branch / evidence\u003c/th>\u003cth scope=\"col\">Kya mila\u003c/th>\u003cth scope=\"col\">Merge decision\u003c/th>\u003c/tr>\u003c/thead>\n    \u003ctbody>\n      \u003ctr>\u003ctd>\u003ccode>feat/owner-experience-on-main\u003c/code>\u003cbr>Test commit \u003ca href=\"https://github.com/GNB-motors/main-backend/commit/7050e8e9\">7050e8e9\u003c/a>, integration merge \u003ca href=\"https://github.com/GNB-motors/main-backend/commit/2165fe0a\">2165fe0a\u003c/a>\u003c/td>\u003ctd>Branch mein \u003ccode>GET /api/app/v2/captures/review\u003c/code> aur owner router before driver router, dono hain. Backend release branch mein ye fix port ho gaya.\u003c/td>\u003ctd>\u003cstrong>Backend fix included.\u003c/strong> Ab mobile ko new path call karna hai.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>feat/owner-experience-followup-20261029\u003c/code>\u003cbr>Backend commit \u003ca href=\"https://github.com/GNB-motors/main-backend/commit/8ea4b864\">8ea4b864\u003c/a>, mobile \u003ca href=\"https://github.com/GNB-motors/DriverApp/commit/972e944\">972e944\u003c/a>\u003c/td>\u003ctd>Backend mein arrival promises, trip-cost closure, reconciliation, crew/trip group targeting aur report distribution ke implementations. Mobile mein owner crew, promise aur trip-cost screens. Backend implementation release branch mein port hui. Mobile implementation reference branch par hai.\u003c/td>\u003ctd>\u003cstrong>Mobile reference available.\u003c/strong> Current mobile release branch main se cut hui. Screens ko current contracts par port karke test karna hai. Route ETA integration Phase 2 mein rahe.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>feat/driver-app-backend-combined\u003c/code>, \u003ccode>feat/driver-app-backend-integration\u003c/code>, N3/N4/N6 branches\u003c/td>\u003ctd>Combined/integration refs mein main se bahar koi equivalent-diff comparison mein unique non-merge patch nahi mila. Stop questions, fusion aur taxonomy refs main ki history mein hain. Older road reports/help refs ke matching features main mein newer versions ke saath hain.\u003c/td>\u003ctd>\u003cstrong>Use main.\u003c/strong> Crew, prompts, road reports, help, fusion aur taxonomy ka code main mein available hai. Inki pending integration neeche listed hai. \u003ca href=\"https://github.com/GNB-motors/main-backend/commit/3de86466\">3 November release\u003c/a>\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>fix/main-ci-2026-11-03\u003c/code>\u003cbr>\u003ca href=\"https://github.com/GNB-motors/main-backend/commit/5911b2ec\">5911b2ec\u003c/a>, \u003ca href=\"https://github.com/GNB-motors/main-backend/commit/8445b3a2\">8445b3a2\u003c/a>\u003c/td>\u003ctd>Branch history mein app tests ko shard karne ka attempt hai. Tip dedicated step hata deta hai. Current main ka CI alag evolve hua hai aur default test shards unit paths target karte hain. Dedicated mandatory driver-app matrix job nahi mila.\u003c/td>\u003ctd>\u003cstrong>01 mein CI fix main se likho.\u003c/strong> Old sharding patch ko sizing reference ke liye dekho. Full branch merge simulation workflow mein conflict deti hai.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>feat/office-bill-pairing\u003c/code> \u00b7 \u003ca href=\"https://github.com/GNB-motors/main-backend/pull/448\">PR #448\u003c/a>\u003c/td>\u003ctd>Current main mein office/WhatsApp diesel slip aur odometer evidence pairing hai. Driver reimbursement legacy bill + khata service se alag lifecycle hai.\u003c/td>\u003ctd>\u003cstrong>Existing pairing ko 09 mein reuse karo\u003c/strong> jahaan applicable evidence available hai. Wallet credit ka decision 04 ke financial workflow mein rahe.\u003c/td>\u003c/tr>\n      \u003ctr>\u003ctd>\u003ccode>feat/ferrostar-navigation-20261031\u003c/code>\u003cbr>\u003ca href=\"https://github.com/GNB-motors/DriverApp/commit/acd45f2\">Mobile version header patch\u003c/a>\u003c/td>\u003ctd>Navigation work ke saath version-header example bhi hai.\u003c/td>\u003ctd>\u003cstrong>Phase 2 branch.\u003c/strong> 01 mein version-header hunk reference kar sakte ho. Current app version aur supported API versions ka agreement phir bhi chahiye.\u003c/td>\u003c/tr>\n    \u003c/tbody>\n  \u003c/table>\u003c/div>\n\u003c/section>\u003c/section>\n\u003csection id=\"end-to-end\" class=\"route-view\" hidden>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>End-to-end sign-off\u003c/h1>\u003cp>Ek real shift ka demo aur Phase 1 close karne ke checks.\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"panel\">\n\u003ch2>Seedha answer\u003c/h2>\n\u003cp>\u003cstrong>Phase 1 independently complete ho sakta hai. Abhi complete nahi hai.\u003c/strong> Driver, Field Agent, Manager aur Owner ke non-navigation workflows neeche diye staging aur pilot checks pass karenge tab Phase 1 done maana jayega. Release branches mein APIs aur screens kaafi had tak available hain. Main pending kaam mobile wiring, kuch backend connections, aur end-to-end proof hai.\u003c/p>\n\u003cp>Master plan ka poora sign-off Phase 2 ke baad hoga. Usme navigation ke saath route-dependent ETA, traffic, reroute, e-way ETA alerts aur navigation pilot gates bhi aate hain.\u003c/p>\n\u003c/section>\n\u003csection>\n\u003ch2>Ek real shift mein kya prove karna hai\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth scope=\"col\">Step\u003c/th>\u003cth scope=\"col\">End-to-end demo\u003c/th>\u003cth scope=\"col\">Abhi status\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>1 \u00b7 Shift start\u003c/td>\u003ctd>Driver login kare, location notice dekhe, correct truck pair kare. Network cut aur token expiry ke baad same account ki queued GPS fixes ek baar sync hon. Off-duty ya consent withdrawal par phone collection stop ho.\u003c/td>\u003ctd>Backend refresh aur queue pieces ready. Mobile lifecycle aur device proof pending.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>2 \u00b7 Field Agent fuel entry\u003c/td>\u003ctd>Field Agent eligible org switch kare, allowed truck select kare aur receipt ke saath fuel submit kare. Cross-org ya out-of-scope truck deny ho. Network retry duplicate entry na banaye.\u003c/td>\u003ctd>Active workflow aur parity checks available. Release-device demo pending.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>3 \u00b7 Road aur plant\u003c/td>\u003ctd>During shift driver road issue report kare. Safe stop par prompt answer/dismiss/expire ho. Plant approach, entry aur exit GPS evidence se create hon, correct phone par push aaye aur tap se correct card khule.\u003c/td>\u003ctd>Visit/report/prompt components available. Live GPS wiring, driver prompt UI aur field latency pending.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>4 \u00b7 Two-driver handover\u003c/td>\u003ctd>A se B ko confirmed handover, disputed responses alag, aur baad ke fuel, driving score aur duty evidence correct stint se trace ho. Retry se extra interval na bane.\u003c/td>\u003ctd>Manual handover available. Shared prompt, break plan aur attribution migration pending.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>5 \u00b7 Document aur reimbursement\u003c/td>\u003ctd>Driver photo bheje. Owner correct branch se original/extraction review kare, correction ya retake reason de. Reimbursable bill confirm ho toh Wallet mein ek baar credit aaye. Actual settlement alag ledger entry ho.\u003c/td>\u003ctd>Owner review route backend release par verified. Mobile path, driver-specific capture scope, status/retake aur Wallet integration pending.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>6 \u00b7 Office action\u003c/td>\u003ctd>Manager breakdown/SOS card dekhe, call kare, actual outcome save kare aur card handle kare. Driver ka reply usi card par aaye. Broadcast intended recipients ko mile aur acknowledgements visible hon.\u003c/td>\u003ctd>Card, message aur action APIs available. Mobile actions aur same-card reply verification pending.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>7 \u00b7 Daily close\u003c/td>\u003ctd>Owner report mein fuel/expense/plant and trip evidence raw rows se match kare. Promise aur trip costs auditable hon. Missing source unknown rahe. Expiry, retake aur report delivery correct record khole.\u003c/td>\u003ctd>Core report active aur extra backend contracts present. Mobile UI, source reconciliation aur delivery setup/proof pending.\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003c/section>\n\u003csection>\n\u003ch2>Master plan se phase-wise closure\u003c/h2>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth scope=\"col\">Plan\u003c/th>\u003cth scope=\"col\">Phase 1 mein close karna hai\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>N0 \u00b7 Decisions aur usability\u003c/td>\u003ctd>Pilot org, devices, scope aur baseline documented hon. Relevant non-nav screens ka driver, manager aur owner walkthrough aur Hindi/Bengali copy check ho. Master plan ka navigation-specific usability gate Phase 2 mein hai.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N1 \u00b7 Foundations\u003c/td>\u003ctd>API version aur contract sweep CI mein required ho. Mobile refresh, consent stop within 1 min, history retention/downsampling, cross-instance SSE, document role checks, secret rotation status, offline banner aur language coverage verify hon. Site movement rows pilot sites ke liye validate hon.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N2 \u00b7 Non-nav workflows\u003c/td>\u003ctd>Plant entry/exit and site card, messages/voice notes/broadcasts aur owner report sign-off. Plant entry p90 \u2264 90 sec aur false entries measure karo. Owner report 7 daily samples raw rows se spot-check karo. Core messaging/broadcast delivery aur owner report 5/7 days usage measure karo.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N3 \u00b7 Crew, capture aur manager\u003c/td>\u003ctd>Confident at-wheel coverage report, exact 10-second prompt and outcome separation, 7-day dismiss/expiry monitoring, 300 labelled capture accuracy, manager act-rate \u2265 50%, help in \u2264 2 taps. Voice-note transcription spike ko real samples par measure karke decision record karo where included.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N4 \u00b7 Live data without routing\u003c/td>\u003ctd>Tracking-dark, moving-without-driver aur verified engine-idle cases ke inputs and false cards verify karo. Plant audience membership ko live visits se check karo. Route-aware deviation, lane groups and predictive jam/reroute closure Phase 2 mein hai.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N5 \u00b7 Learned ETA\u003c/td>\u003ctd>Phase 2. Admitted-factor backtests aur ETA calibration navigation evidence ke saath close honge.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N6 \u00b7 Paper and money\u003c/td>\u003ctd>Per-type extraction, original vs sensor disagreement, owner decision, driver status/push, basic expiry/challan checks aur ERP reconciliation. Auto-accept sirf measured precision bar clear hone par. E-way validity vs P80 ETA Phase 2 mein.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>N7 \u00b7 Pilot to rollout\u003c/td>\u003ctd>Targets predeclare karo. OEM battery/offline, handover aur three-plant field drills run karo. Monitoring, support content/runbook aur staged rollout proof collect karo. Plan har rollout stage ke targets 14 days hold karne ko kehta hai.\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/main-backend/blob/23cbaa95/docs/DRIVER_NAV_MASTER_PLAN_2026-10-28.md\">Master plan \u00b7 Part 18\u003c/a>\u003c/p>\n\u003c/section>\n\u003csection class=\"panel\">\n\u003ch2>Release verification\u003c/h2>\n\u003cp>Backend release par 64 targeted tests aur capture-route regression pass hue. Frontend ke six checks pass hue. Device, staging aur pilot sign-off abhi pending hai.\u003c/p>\n\u003cp>Backend \u003ccode>release/en-24-nov-backend\u003c/code> at \u003ccode>77d257c5\u003c/code> \u00b7 Mobile \u003ccode>release/en-24-nov-driver-app\u003c/code> at \u003ccode>73a415f\u003c/code>.\u003c/p>\n\u003c/section>\u003c/section>\n\u003csection id=\"qa\" class=\"route-view\" hidden>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>QA evidence\u003c/h1>\u003cp>Passed checks, device drills aur rollout evidence.\u003c/p>\u003c/div>\u003c/header>\u003csection>\n\u003cp class=\"view\">\u003cstrong>App view\u003c/strong> \u00b7 Driver \u00b7 Field Agent \u00b7 Manager \u00b7 Owner\u003c/p>\n\u003cp class=\"meta\">N0, remaining non-nav N1 gates, N7\u003c/p>\n\u003cdiv class=\"table-scroll\">\u003ctable>\n\u003cthead>\u003ctr>\u003cth scope=\"col\">QA scenario\u003c/th>\u003cth scope=\"col\">Evidence required\u003c/th>\u003c/tr>\u003c/thead>\n\u003ctbody>\n\u003ctr>\u003ctd>One driver, normal day\u003c/td>\u003ctd>Login \u2192 pair/on-duty \u2192 document photo \u2192 owner review \u2192 driver notification. Separate reimbursable bill \u2192 confirmation \u2192 ledger \u2192 settlement demo. No fabricated balances.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Two drivers, two trucks, shared phone\u003c/td>\u003ctd>Handover and disputed response, wrong-truck change, account/org switch, and scoped mobile/API reads. Driver B should not see A\u2019s queued photos, location or wallet. Branch reviewer boundaries hold.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Network, consent, device\u003c/td>\u003ctd>Airplane mode, expiry, retry, delayed/mock GPS, clock skew, GPS-only/phone-only/both dark, denied location and OEM task kill. Real Android device runs including relevant Xiaomi/Oppo/Vivo models and iOS push/camera. Verify local collection stops as well as server ingestion.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Office and plant\u003c/td>\u003ctd>Three pilot plants, timed entry/exit, no duplicate push. Manager call/result and driver reply. Owner daily report raw-row spot checks across 7 days. Broadcast receipt and permission checks.\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Release\u003c/td>\u003ctd>Record pilot org, people and acceptance targets before trials. Confirm staging job/push/OCR readiness, secret rotation status and retention/TTL evidence. Test build, observability, support runbook aur staged rollout verify karo. Master plan calls for targets to hold 14 days per stage. SSE reconnect across server instances, stale/resync handling aur scoped events ko staging mein verify karo.\u003c/td>\u003c/tr>\n\u003c/tbody>\n\u003c/table>\u003c/div>\n\u003cdiv class=\"panel\">\n  \u003ch3>Checks actually run\u003c/h3>\n  \u003cp>DriverApp main ke \u003ccode>check:api\u003c/code>, \u003ccode>check:telematics\u003c/code>, \u003ccode>check:parity\u003c/code>, \u003ccode>check:push\u003c/code>, \u003ccode>check:owner\u003c/code> aur \u003ccode>check:live-data\u003c/code> pass hue. Backend remote main ke isolated checkout mein 5 focused suites / 55 tests aur 5 local Mongo/Redis suites / 79 tests pass hue, including contract sweep with mobile source scan, visits, capture intake, app refresh aur owner experience.\u003c/p>\n  \u003cp>Owner experience suite apna isolated router mount karti hai. Ek alag local regression probe ne full mounted server par confirm kiya ki versioned OWNER request ko current captures list aur proposed review URL par 403 milta hai. Version header ke bina crew request ko 426 mila. Full device flows, production config, SLOs aur deployment verify nahi kiye gaye. Ye results earlier main baseline ke hain.\u003c/p>\n  \u003cp>\u003cstrong>Release verification\u003c/strong> Owner Experience, contract sweep aur OpenAPI ke 64 tests pass hue. Updated sweep ka dedicated route test bhi pass hua. Owner review returned 200, existing driver capture list returned 200, aur driver ko owner review par 403 mila. Frontend release branch par six mobile checks pass hue.\u003c/p>\n  \u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/tests/app/ownerExperience.db.test.js#L35\">Owner test mount\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/docs/DRIVER_NAV_MASTER_PLAN_2026-10-28.md#182-phase-n0-decide-12-weeks\">Master plan\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/main-backend/blob/23cbaa95/docs/driver-app/README.md\">Original driver brief\u003c/a>\u003c/p>\n\u003c/div>\n\u003c/section>\u003c/section>\n\u003csection id=\"phase-2\" class=\"route-view\" hidden>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>Phase 2 \u00b7 Navigation\u003c/h1>\u003cp>Routing, guidance, offline maps, live road aur learned ETA.\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"panel\">\n\u003cul>\n\u003cli>\u003cstrong>Plan aur guide\u003c/strong> \u00b7 NavSession, ERP ya manual destination, Valhalla truck rules/alternatives, learned corridors, Ferrostar/MapLibre, 3-language maneuver audio aur off-route recovery.\u003c/li>\n\u003cli>\u003cstrong>Offline navigation\u003c/strong> \u00b7 Approved tile artifacts, offline corridor packs, location cadence, battery/device budgets aur map/routing failover drill.\u003c/li>\n\u003cli>\u003cstrong>Live road\u003c/strong> \u00b7 Probe/fused position quality proof, traffic and predictive jam prompts, upcoming tolls/pumps/parking, corridor alerts aur rerouting.\u003c/li>\n\u003cli>\u003cstrong>Learned ETA\u003c/strong> \u00b7 Real inputs, calibration, held-out evidence, ETA range and source clarity, promise risk and e-way validity vs P80 ETA. Lane groups aur route-deviation cards bhi route data se connect honge.\u003c/li>\n\u003cli>\u003cstrong>Navigation pilot\u003c/strong> \u00b7 Master plan calls for 10 drivers and at least 50 navigated trips, maneuver completion \u2265 95%, crash-free sessions \u2265 99.5% aur data \u2264 5 MB/day. Entry alert p90 \u2264 90 sec Phase 1 plant work ke saath bhi verify hoga.\u003c/li>\n\u003c/ul>\n\u003cp>Ferrostar reference branches aur backend routing pieces available hain. Active release branch pe feature integration, field behavior aur pilot acceptance independently prove karne hain.\u003c/p>\n\u003c/section>\u003c/section>\n\u003csection id=\"tickets\" class=\"route-view\" hidden>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>Tickets\u003c/h1>\u003cp>Feature choose karo. Ticket par app view, backend, mobile aur done check dikhega.\u003c/p>\u003c/div>\u003c/header>\u003cdiv class=\"ticket-index\">\u003clabel for=\"ticket-search\">Find a ticket\u003c/label>\u003cinput id=\"ticket-search\" type=\"search\" placeholder=\"Search feature or app view\">\u003cp class=\"search-result\" id=\"ticket-result\" aria-live=\"polite\">\u003c/p>\n  \u003cdiv class=\"resource-list\" id=\"ticket-list\">\u003ca href=\"#ticket-api\">\u003cspan>\u003cstrong>01 \u00b7 API compatibility aur release gate\u003c/strong>\u003csmall>All app views\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\u003ca href=\"#ticket-session\">\u003cspan>\u003cstrong>02 \u00b7 Session refresh, permission aur GPS queue\u003c/strong>\u003csmall>Driver \u00b7 shared login\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\u003ca href=\"#ticket-papers\">\u003cspan>\u003cstrong>03 \u00b7 Universal paper capture aur owner review\u003c/strong>\u003csmall>Driver \u00b7 Owner \u00b7 Field Agent API\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\u003ca href=\"#ticket-wallet\">\u003cspan>\u003cstrong>04 \u00b7 Reimbursable bill se Wallet\u003c/strong>\u003csmall>Driver \u00b7 Owner\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\u003ca href=\"#ticket-crew\">\u003cspan>\u003cstrong>05 \u00b7 Two drivers, mid-trip handover aur attribution\u003c/strong>\u003csmall>Driver \u00b7 Manager \u00b7 Owner\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\u003ca href=\"#ticket-plant\">\u003cspan>\u003cstrong>06 \u00b7 Automatic plant entry / exit\u003c/strong>\u003csmall>Driver\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\u003ca href=\"#ticket-road\">\u003cspan>\u003cstrong>07 \u00b7 Road reports aur low-distraction prompts\u003c/strong>\u003csmall>Driver\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\u003ca href=\"#ticket-office\">\u003cspan>\u003cstrong>08 \u00b7 Manager actions, driver help aur communication\u003c/strong>\u003csmall>Manager \u00b7 Driver\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\u003ca href=\"#ticket-followup\">\u003cspan>\u003cstrong>09A\u201309D \u00b7 Owner follow-up features\u003c/strong>\u003csmall>Owner\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\u003ca href=\"#ticket-evidence\">\u003cspan>\u003cstrong>09 \u00b7 Paper evidence aur owner report completeness\u003c/strong>\u003csmall>Owner \u00b7 Driver\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\u003ca href=\"#ticket-field-agent\">\u003cspan>\u003cstrong>Field Agent \u00b7 Org aur fuel flow\u003c/strong>\u003csmall>Field Agent\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\u003c/div>\u003c/div>\u003c/section>\n\u003csection id=\"ticket-api\" class=\"route-view\" hidden>\u003cnav class=\"ticket-nav\" aria-label=\"Ticket navigation\">\u003ca id=\"return-ticket-api\" class=\"return-link\" href=\"#tickets\">\u2190 All tickets\u003c/a>\u003c/nav>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>01 \u00b7 API compatibility aur release gate\u003c/h1>\u003c/div>\u003cbutton class=\"copy-ticket\" type=\"button\">Copy ticket\u003c/button>\u003c/header>\u003carticle class=\"ticket\" data-title=\"01 \u00b7 API compatibility aur release gate\">\n\n\u003cp class=\"view\">\u003cstrong>App view\u003c/strong> \u00b7 Driver \u00b7 Field Agent \u00b7 Manager \u00b7 Owner\u003c/p>\n\u003cp class=\"meta\">P0 \u00b7 Master plan N1.1, N1.2, N1.15\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Backend mein bana\u003c/h4>\u003cp>Separated \u003ccode>app/driverApp\u003c/code>, manifest router, OpenAPI aur mutation sweep. Missing app version default \u003ccode>1.0.0\u003c/code> hai. Crew, duty, help, road reports aur manager cards mein \u003ccode>2.0.0\u003c/code> minimum milta hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bana\u003c/h4>\u003cp>Active app version \u003ccode>1.0.1\u003c/code> hai. Mobile request new minimum ke liye version header nahi bhejti. Default config par affected endpoints 426 de sakte hain.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Backend mein bacha\u003c/h4>\u003cp>Mobile ke saath decide karo kaunse contracts current binary support karti hai aur kise newer release chahiye. Legacy routes retain karo. Mounted route, manifest/inventory, role + org + branch + driver scope, validation, idempotency, response shape aur version cases cover karo. Owner/legacy surface aur duplicate method/path mounts ki integration coverage add karo. CI mein DriverApp checkout aur mandatory \u003ccode>DRIVERAPP_SRC\u003c/code> ke saath focused app job chalao.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bacha\u003c/h4>\u003cp>Shared, telematics aur relevant background callers se actual released build version bhejo. 426 par actionable update state do. Old supported build ke sign-in, capture aur SOS paths verify karo.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp class=\"done\">\u003cstrong>Done jab\u003c/strong> Current supported build se crew, help, duty, road report aur manager cards open hon. Old supported paths pass hon. CI mein missing coverage aur duplicate registration dono fail hon, aur green run mein app call scan skipped na ho.\u003c/p>\n\u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/app/driverApp/api/router.js#L152\">Version guard\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/tests/app/sweep/contractSweep.test.js\">Sweep\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/frontend/src/telematics/services/telematicsApi.js\">Mobile client\u003c/a>\u003c/p>\n\u003c/article>\u003c/section>\n\u003csection id=\"ticket-session\" class=\"route-view\" hidden>\u003cnav class=\"ticket-nav\" aria-label=\"Ticket navigation\">\u003ca id=\"return-ticket-session\" class=\"return-link\" href=\"#tickets\">\u2190 All tickets\u003c/a>\u003c/nav>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>02 \u00b7 Session refresh, permission aur GPS queue\u003c/h1>\u003c/div>\u003cbutton class=\"copy-ticket\" type=\"button\">Copy ticket\u003c/button>\u003c/header>\u003carticle class=\"ticket\" data-title=\"02 \u00b7 Session refresh, permission aur GPS queue\">\n\n\u003cp class=\"view\">\u003cstrong>App view\u003c/strong> \u00b7 Driver GPS \u00b7 Shared login for all views\u003c/p>\n\u003cp class=\"meta\">P0 \u00b7 N1.3, N1.10, N1.12\u20131.13\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Backend mein bana\u003c/h4>\u003cp>\u003ccode>POST /api/auth/app/refresh\u003c/code> returns rotated credentials in \u003ccode>data.accessToken\u003c/code> and \u003ccode>data.refreshToken\u003c/code>. Revocation, location batches, retention, consent upload check, probe/fusion aur SSE infrastructure code mein hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bana\u003c/h4>\u003cp>Queue identity-scoped aur acknowledged hai. Refresh login/restore se connected nahi. Dormant refresh interceptor wrong path/shape read karti hai. Background task old bearer use karta hai. Consent withdrawal UI refresh karti hai, native sampler ko directly stop nahi karti.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Backend mein bacha\u003c/h4>\u003cp>Login, rotate, revoke aur expired offline replay responses mobile team ke saath freeze karo. Collection eligibility ke liye authoritative paired/on-duty state expose ya reuse karo. Session expiry, consent withdrawal aur no-data health reason ko clearly distinguish karo.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bacha\u003c/h4>\u003cp>Rotated credentials securely persist karo. Foreground aur background refresh ko coordinate karo taaki ek token do baar rotate na ho. Logout/account switch race guard karo. Same account re-login pe original queue IDs replay karo. Consent withdrawal, duty end aur account switch pe foreground/background sampling stop karo. Denied permission state clearly show karo.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp class=\"done\">\u003cstrong>Done jab\u003c/strong> Offline \u2192 expiry \u2192 reconnect/re-login mein same-account queue safely replay ho. Account B ko A ka queue na mile. Background samet sampling withdrawal ke 1 minute ke andar stop ho. App logout se web logout na ho. Device logs mein OEM kill/recovery aur denied permission prove karo.\u003c/p>\n\u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/app/modules/auth/auth.routes.js#L159\">Refresh route\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/frontend/src/context/AuthContext.js\">AuthContext\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/frontend/src/telematics/tracking/useDriverLocationSharing.js\">Tracking\u003c/a>\u003c/p>\n\u003c/article>\u003c/section>\n\u003csection id=\"ticket-papers\" class=\"route-view\" hidden>\u003cnav class=\"ticket-nav\" aria-label=\"Ticket navigation\">\u003ca id=\"return-ticket-papers\" class=\"return-link\" href=\"#tickets\">\u2190 All tickets\u003c/a>\u003c/nav>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>03 \u00b7 Universal paper capture aur owner review\u003c/h1>\u003c/div>\u003cbutton class=\"copy-ticket\" type=\"button\">Copy ticket\u003c/button>\u003c/header>\u003carticle class=\"ticket\" data-title=\"03 \u00b7 Universal paper capture aur owner review\">\n\n\u003cp class=\"view\">\u003cstrong>App view\u003c/strong> \u00b7 Driver capture \u00b7 Owner review \u00b7 Field Agent capture API\u003c/p>\n\u003cp class=\"meta\">P0 route fix \u00b7 P1 workflow \u00b7 N3.7, N6.1, N6.3\u20136.4 \u00b7 Device demo 01 ke baad\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Backend mein bana\u003c/h4>\u003cp>Legacy AUTO document stores original + OCR suggestions. V2 intake mein retake, hash/dedup, classifier, extraction aur context model hain. Owner queue legacy Document data read karti hai. Release backend par owner review \u003ccode>GET /api/app/v2/captures/review\u003c/code> se pehle match hota hai. Driver intake paths retain kiye gaye hain. Latest main mein office bill metadata aur dedup race handling bhi hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bana\u003c/h4>\u003cp>Quick Capture ka Universal Capture older personal document form open karta hai. V2 create/retake helpers screen se connected nahi. My papers document list hai. Verify se record update hota hai. \u201cNote an issue\u201d se driver-visible rejection nahi banti.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Backend mein bacha\u003c/h4>\u003cp>03A ka backend route ready hai. V2 intake reads aur retake ko actual record owner par scope karo, including dedup responses. 03B mein one capture-to-review lifecycle agree karo, linking legacy records where needed. Owner verify/correct/retake/reject decisions, original evidence, audit history aur driver push define karo.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bacha\u003c/h4>\u003cp>Driver camera-first capture, original fingerprint and persistent request ID, upload states, readable retake flow aur My Papers status jodo. Owner queue \u003ccode>/app/v2/captures/review\u003c/code> use kare aur original vs extracted fields dikhaye. Rejection/retake push correct record open kare. Existing compliance-document workflow preserve karo.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp class=\"done\">\u003cstrong>Done jab\u003c/strong> Driver A ki clear aur blurry photo Owner ki correct branch queue mein aaye. Driver B uska paper na dekh ya badal sake. Duplicate retry se extra record na bane. Owner correction/retake reason A ko dikhe. OCR unavailable ho toh original aur manual review available rahen.\u003c/p>\n\u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/app/app.js#L497\">Original mount order on main\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/app/driverApp/api/routes/capture.controller.js#L169\">Intake reads\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/frontend/src/telematics/screens/OwnerReportScreens.js\">Mobile owner review\u003c/a>\u003c/p>\n\u003c/article>\u003c/section>\n\u003csection id=\"ticket-wallet\" class=\"route-view\" hidden>\u003cnav class=\"ticket-nav\" aria-label=\"Ticket navigation\">\u003ca id=\"return-ticket-wallet\" class=\"return-link\" href=\"#tickets\">\u2190 All tickets\u003c/a>\u003c/nav>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>04 \u00b7 Reimbursable bill se Wallet\u003c/h1>\u003c/div>\u003cbutton class=\"copy-ticket\" type=\"button\">Copy ticket\u003c/button>\u003c/header>\u003carticle class=\"ticket\" data-title=\"04 \u00b7 Reimbursable bill se Wallet\">\n\n\u003cp class=\"view\">\u003cstrong>App view\u003c/strong> \u00b7 Driver wallet \u00b7 Owner review\u003c/p>\n\u003cp class=\"meta\">P1 \u00b7 N6.3\u20136.4 \u00b7 Existing v1 APIs se start\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Backend mein bana\u003c/h4>\u003cp>V1 bill submit/list/detail/confirm/reject aur khata summary/ledger hain. Pending/rejected bills wallet math se exclude hote hain. V1 upload amount aur receipt maangta hai. Office slip pairing ka accounting purpose alag hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bana\u003c/h4>\u003cp>WalletScreen aur bill client source mein hain. Active Driver stack Wallet/Add Bill register nahi karta. Capture mein Workshop Bill OCR hai, reimbursement Add Bill ka equivalent nahi. Existing owner review mein expense decision path milta hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Backend mein bacha\u003c/h4>\u003cp>Driver-paid expense ke liye canonical bill \u2192 owner decision \u2192 khata flow freeze karo. Submit retries ka stable key, concurrent review ka single outcome, driver self-read aur reviewer branch permissions test karo. Settlement event aur rejection reason ka contract confirm karo. Single photo se paper aur financial record link chahiye toh 03 ke saath shared reference agree karo.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bacha\u003c/h4>\u003cp>Active home/More mein Wallet, capture mein Add Bill, amount/date/photo, pending list, detail, reject reason aur resubmit jodo. Owner pending bills queue se confirm/reject kare. Wallet ledger mein approval aur actual payment independently show karo. Agar photo-only submission chahiye, 03 se extraction + owner correction contract lo.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp class=\"done\">\u003cstrong>Done jab\u003c/strong> Staging mein \u20b9500 pending par balance unchanged, approval par \u20b9500 ek baar, actual settlement par ledger alag entry dikhaye. Reject reason driver tak aaye. Double tap aur lost response ke baad duplicate credit na ho.\u003c/p>\n\u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/design/bill-confirmation-wallet-loop/Bill%20to%20Wallet.dc.html\">Bill to Wallet design\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/frontend/src/screens/driver/wallet/WalletScreen.js\">Existing Wallet\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/app/modules/appV1/bill.controller.js\">Existing bill contract\u003c/a>\u003c/p>\n\u003c/article>\u003c/section>\n\u003csection id=\"ticket-crew\" class=\"route-view\" hidden>\u003cnav class=\"ticket-nav\" aria-label=\"Ticket navigation\">\u003ca id=\"return-ticket-crew\" class=\"return-link\" href=\"#tickets\">\u2190 All tickets\u003c/a>\u003c/nav>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>05 \u00b7 Two drivers, mid-trip handover aur attribution\u003c/h1>\u003c/div>\u003cbutton class=\"copy-ticket\" type=\"button\">Copy ticket\u003c/button>\u003c/header>\u003carticle class=\"ticket\" data-title=\"05 \u00b7 Two drivers, mid-trip handover aur attribution\">\n\n\u003cp class=\"view\">\u003cstrong>App view\u003c/strong> \u00b7 Driver handover and duty \u00b7 Manager crew history \u00b7 Owner crew\u003c/p>\n\u003cp class=\"meta\">P1 \u00b7 N3.1\u20133.3 \u00b7 Prompt component 07 se reuse\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Backend mein bana\u003c/h4>\u003cp>Crew and at-wheel intervals, roster, versioned handover, DVA mirroring, \u201cWho is driving?\u201d prompt backend aur duty/break-plan APIs hain. Common historical attribution abhi assignment intervals read karti hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bana\u003c/h4>\u003cp>Driver crew invitation/explicit handover, reviewer crew history aur Rest &amp; hours screen hain. Shared two-phone question aur break-plan result active UI mein wired nahi mile.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Backend mein bacha\u003c/h4>\u003cp>Current primary/co-driver pairing and migrations verify karo. Confirmed at-wheel intervals ko fuel/oil, score aur duty readers se align karo. Disputed/unconfirmed time separately preserve karo. DVA mirror comparison/dry run aur old-data fallback prove karo. Fuel submitter aur event-time driver ke fields clearly rakho.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bacha\u003c/h4>\u003cp>Both phones par role, safe prompt recipient, accept/dispute/pending/expired states, receipt-time handover aur rest + break plan render karo. Existing explicit handover ko reuse karo.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp class=\"done\">\u003cstrong>Done jab\u003c/strong> Two phones par A drives \u2192 B takes over at stop \u2192 later fuel and duty/score B ke stint se trace ho. Conflicting answers dispute hi rahen. Offline retry se extra interval na bane. Confident-stint coverage pilot report mein aaye.\u003c/p>\n\u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/docs/driver-app/CREW_READER_AUDIT.md\">Reader audit\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/frontend/src/telematics/screens/CrewScreens.js\">Crew screens\u003c/a>\u003c/p>\n\u003c/article>\u003c/section>\n\u003csection id=\"ticket-plant\" class=\"route-view\" hidden>\u003cnav class=\"ticket-nav\" aria-label=\"Ticket navigation\">\u003ca id=\"return-ticket-plant\" class=\"return-link\" href=\"#tickets\">\u2190 All tickets\u003c/a>\u003c/nav>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>06 \u00b7 Automatic plant entry / exit\u003c/h1>\u003c/div>\u003cbutton class=\"copy-ticket\" type=\"button\">Copy ticket\u003c/button>\u003c/header>\u003carticle class=\"ticket\" data-title=\"06 \u00b7 Automatic plant entry / exit\">\n\n\u003cp class=\"view\">\u003cstrong>App view\u003c/strong> \u00b7 Driver site card and notifications\u003c/p>\n\u003cp class=\"meta\">P1 \u00b7 N2.9 \u00b7 Turn-by-turn se independent\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Backend mein bana\u003c/h4>\u003cp>Visit state machine, thresholds, site card, entry/exit push code aur persistence hain. Main ke source search mein live production caller of \u003ccode>ingestEvidence\u003c/code> nahi mila.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bana\u003c/h4>\u003cp>Site Card active visit lookup karti hai. Dedicated push tap to site card route nahi mila.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Backend mein bacha\u003c/h4>\u003cp>Known truck and site evidence ko visit ingestion se connect karo. Stale/replayed observations, out-of-order events, repeated boundary crossings aur driver association handle karo. Entry/exit time aur notification dispatch time log karo. Same visit lifecycle retry-safe rakho.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bacha\u003c/h4>\u003cp>Entry/exit push tap se correct authorized site card open karo. Unknown queue/gate honest state dikhaye. Checklist aur exit ke baad relevant POD affordance connect karo.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp class=\"done\">\u003cstrong>Done jab\u003c/strong> GPS replay and real visits on three pilot plants mein entry + exit once per visit, passing truck par false alert measure ho aur entry latency p90 \u2264 90 seconds aaye. Tap se current site khule.\u003c/p>\n\u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/app/driverApp/adapters/visits/visit.service.js#L274\">Visit ingestion\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/frontend/src/services/NotificationRouter.js\">Push routing\u003c/a>\u003c/p>\n\u003c/article>\u003c/section>\n\u003csection id=\"ticket-road\" class=\"route-view\" hidden>\u003cnav class=\"ticket-nav\" aria-label=\"Ticket navigation\">\u003ca id=\"return-ticket-road\" class=\"return-link\" href=\"#tickets\">\u2190 All tickets\u003c/a>\u003c/nav>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>07 \u00b7 Road reports aur low-distraction prompts\u003c/h1>\u003c/div>\u003cbutton class=\"copy-ticket\" type=\"button\">Copy ticket\u003c/button>\u003c/header>\u003carticle class=\"ticket\" data-title=\"07 \u00b7 Road reports aur low-distraction prompts\">\n\n\u003cp class=\"view\">\u003cstrong>App view\u003c/strong> \u00b7 Driver road reports and prompts\u003c/p>\n\u003cp class=\"meta\">P1 \u00b7 N3.4\u20133.6 \u00b7 Reusable UI for 05\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Backend mein bana\u003c/h4>\u003cp>Report create/list/still-there, prompt policy/budget, inbox, answer, and stop question APIs hain. Probe v2 and fusion analysis bhi main mein hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bana\u003c/h4>\u003cp>Report screen sends type and fresh timestamp ID per attempt, server last fix par depend karti hai. Nearby feed aur still-there reader active nahi mile. Prompt event refresh trigger karta hai, driver chip render nahi hoti. Manual stop reason path already exists.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Backend mein bacha\u003c/h4>\u003cp>Fresh position and stable retry contract freeze karo. Existing supported types major hazards cover karte hain. Rain aur site queue ke liye product categories decide karo. Stop/refuel/crew cases ko existing prompt policy and evidence se feed karo. Safety, expiry/disposition and outcome counters verify karo.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bacha\u003c/h4>\u003cp>Report request ka original ID save karo. Fresh fix unavailable ho toh honest state do. Nearby/still-there experience and shared prompt host jodo. Yes/No taps, outside dismissal, 10-second fade, no-response path, and motion/co-driver gating implement karo.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp class=\"done\">\u003cstrong>Done jab\u003c/strong> Report retry single event ho. Authorized nearby view report dekhe. Yes, No, dismiss aur timeout independent cases hon. Driver fast move kar raha ho toh unsafe prompt na aaye. Seven-day dismiss/expire and rollback drill pilot mein report ho.\u003c/p>\n\u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/app/driverApp/application/reports/roadReports.usecase.js\">Report rules\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/frontend/src/telematics/screens/DriverServices.js\">Mobile report\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/frontend/src/telematics/context/DriverDataContext.js\">Mobile events\u003c/a>\u003c/p>\n\u003c/article>\u003c/section>\n\u003csection id=\"ticket-office\" class=\"route-view\" hidden>\u003cnav class=\"ticket-nav\" aria-label=\"Ticket navigation\">\u003ca id=\"return-ticket-office\" class=\"return-link\" href=\"#tickets\">\u2190 All tickets\u003c/a>\u003c/nav>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>08 \u00b7 Manager actions, driver help aur communication\u003c/h1>\u003c/div>\u003cbutton class=\"copy-ticket\" type=\"button\">Copy ticket\u003c/button>\u003c/header>\u003carticle class=\"ticket\" data-title=\"08 \u00b7 Manager actions, driver help aur communication\">\n\n\u003cp class=\"view\">\u003cstrong>App view\u003c/strong> \u00b7 Manager action cards \u00b7 Driver help and reply\u003c/p>\n\u003cp class=\"meta\">P1 \u00b7 N2.11\u20132.12, N3.8\u20133.10\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Backend mein bana\u003c/h4>\u003cp>Messaging, voice notes, broadcasts, receipts, call logs, daily report, help, manager rankings/outcome/dismiss/snooze APIs hain. V2 messaging aur owner communication surfaces available hain. Release backend mein extra crew/plant/lane audience APIs hain.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bana\u003c/h4>\u003cp>Owner report and communication active hain. Manager detail evidence/links dikhata hai. Card action mutations UI mein connected nahi mile. Driver helpful-card reply generic Messages kholta hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Backend mein bacha\u003c/h4>\u003cp>Each card action, evidence and driver reply ko same card identity se bind karo. Role/branch and conversation membership verify karo, including owner visibility aur private driver\u2194co-driver 1:1 rule. Publish act-rate per type. Extra audience types 06/Phase 2 source events ready hone ke baad turn on karo.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bacha\u003c/h4>\u003cp>Card se Call, outcome, Handled, Snooze aur attached driver reply connect karo. Dialer launch aur actual outcome separately record karo. Driver Help core surfaces se \u2264 2 taps check karo. Voice note moving state mein auto-play na kare. Owner report schedule and acknowledgement receipt on-device verify karo.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp class=\"done\">\u003cstrong>Done jab\u003c/strong> Manager SOS/breakdown card se evidence \u2192 action \u2192 status/act-rate dekh sake. Driver ka reply usi card par dikhe. Broadcast eligible recipients aur acknowledgements show kare. Pilot mein act-rate \u2265 50% aur owner report opening 5/7 days measure karo.\u003c/p>\n\u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/frontend/src/telematics/experience/ManagerActions.js\">Manager screen\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/app/modules/ownerExperience/README.md\">Owner backend contracts\u003c/a>\u003c/p>\n\u003c/article>\u003c/section>\n\u003csection id=\"ticket-followup\" class=\"route-view\" hidden>\u003cnav class=\"ticket-nav\" aria-label=\"Ticket navigation\">\u003ca id=\"return-ticket-followup\" class=\"return-link\" href=\"#tickets\">\u2190 All tickets\u003c/a>\u003c/nav>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>09A\u201309D \u00b7 Owner follow-up features\u003c/h1>\u003c/div>\u003cbutton class=\"copy-ticket\" type=\"button\">Copy ticket\u003c/button>\u003c/header>\u003carticle class=\"ticket\" data-title=\"09A\u201309D \u00b7 Owner follow-up features\">\n\n\u003cp class=\"view\">\u003cstrong>App view\u003c/strong> \u00b7 Owner reports, trip costs, promises and audiences\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Backend mein bana\u003c/h4>\u003cp>Release branch mein arrival promises, owner-attested trip cost closure, report delivery history aur dynamic audience target/member APIs hain.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bana\u003c/h4>\u003cp>Daily report, messaging aur core owner flows active hain. Owner crew, promise aur trip-cost screens ka reference mobile follow-up commit \u003ccode>972e944\u003c/code> mein hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Backend mein bacha\u003c/h4>\u003cp>Plant/lane membership inputs aur ERP source evidence verify karo. Email/WhatsApp provider config aur approved templates staging mein verify karo. Owner crew declarations ko verified at-wheel evidence se alag track karo jab tak re-use policy agreed ho.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bacha\u003c/h4>\u003cp>Promise capture/history, cost review/closure, audience picker aur opt-in/delivery history UI current release contracts se connect karo. Date, branch aur account changes par evidence refresh verify karo.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp class=\"done\">\u003cstrong>Done jab\u003c/strong> Promise save aur version history, evidence-linked cost closure, dynamic recipient preview aur opt-in delivery history staging mein verify ho. Missing data clearly visible ho.\u003c/p>\n\u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/main-backend/commit/8ea4b864\">Backend follow-up source\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/DriverApp/commit/972e944\">Mobile reference\u003c/a>\u003c/p>\n\u003c/article>\u003c/section>\n\u003csection id=\"ticket-evidence\" class=\"route-view\" hidden>\u003cnav class=\"ticket-nav\" aria-label=\"Ticket navigation\">\u003ca id=\"return-ticket-evidence\" class=\"return-link\" href=\"#tickets\">\u2190 All tickets\u003c/a>\u003c/nav>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>09 \u00b7 Paper evidence aur owner report completeness\u003c/h1>\u003c/div>\u003cbutton class=\"copy-ticket\" type=\"button\">Copy ticket\u003c/button>\u003c/header>\u003carticle class=\"ticket\" data-title=\"09 \u00b7 Paper evidence aur owner report completeness\">\n\n\u003cp class=\"view\">\u003cstrong>App view\u003c/strong> \u00b7 Owner evidence review \u00b7 Driver reminders\u003c/p>\n\u003cp class=\"meta\">P2 \u00b7 N6.1\u20136.7 \u00b7 03/04 ke linked records ke baad\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Backend mein bana\u003c/h4>\u003cp>Taxonomy/extraction dispatcher, fleet diesel slip+odometer pairing, e-way/ERP data aur financial report readers available hain. Release backend mein crew declarations, sensor reconciliation, versioned promises aur trip-margin readers hain. Source evidence missing ho toh partial/unknown state verify karna hai. V2 capture auto-accept disabled hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bana\u003c/h4>\u003cp>Owner report states and drilldowns work in source. Generic document reminder screen document list reuse karti hai. Full paper-review evidence and per-type production accuracy proof open hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Backend mein bacha\u003c/h4>\u003cp>03 ke capture ID par slip/refuel, weighment/load, toll/crossing, repair/workshop, POD/plant-exit matching cases split karo. Evidence disagreement store karo. Labeled samples per type score karo. Trip margin ke liye ERP billed revenue and actual cost reconcile karo. Release backend ka trip closure reuse karo. E-way expiry vs P80 ETA Phase 2 dependency hai, basic expiry separately ship ho sakta hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Mobile mein bacha\u003c/h4>\u003cp>Owner review mein extracted vs observed facts, disagreement, missing evidence aur edit reason dikhaye. Driver ko expiry/retake reminders open correct record. Owner report once sources ready hon tab drilldowns connect karo.\u003c/p>\u003c/div>\n\u003c/div>\n\u003cp class=\"done\">\u003cstrong>Done jab\u003c/strong> Initial 300 owner-labelled captures ka classification result publish ho. Per-type accuracy and correction rate visible ho. Disagreement silently overwrite na ho. Auto-accept tabhi jab owner's cost-based precision bar clear ho. Trip margin sample ERP/raw records se reconcile ho.\u003c/p>\n\u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/app/modules/billMatch/fleetBills.service.js\">Office slip evidence\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/main-backend/blob/d28e7c3a/app/modules/ownerExperience/ownerReport.service.js\">Owner report sources\u003c/a>\u003c/p>\n\u003c/article>\u003c/section>\n\u003csection id=\"ticket-field-agent\" class=\"route-view\" hidden>\u003cnav class=\"ticket-nav\" aria-label=\"Ticket navigation\">\u003ca id=\"return-ticket-field-agent\" class=\"return-link\" href=\"#tickets\">\u2190 All tickets\u003c/a>\u003c/nav>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>Field Agent \u00b7 Org aur fuel flow\u003c/h1>\u003c/div>\u003cbutton class=\"copy-ticket\" type=\"button\">Copy ticket\u003c/button>\u003c/header>\u003carticle class=\"ticket\" data-title=\"Field Agent \u00b7 Org aur fuel flow\">\n\n\u003cp class=\"view\">\u003cstrong>App view\u003c/strong> \u00b7 Field Agent\u003c/p>\n\u003cp>\u003cstrong>Backend aur mobile mein bana\u003c/strong> \u00b7 Org membership selection, vehicle picker aur fuel capture ke active paths hain. Parity check org switching aur truck-bound scope cover karta hai.\u003c/p>\n\u003cp>\u003cstrong>Kya bacha\u003c/strong> \u00b7 Release device test mein eligible org switch karo, scoped vehicle choose karo aur fuel form submit karo. Truck-bound agent ke liye org/vehicle scope bhi verify karo.\u003c/p>\n\u003cp class=\"refs\">\u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/frontend/src/navigation/AppNavigator.js\">Field Agent stack\u003c/a> \u00b7 \u003ca href=\"https://github.com/GNB-motors/DriverApp/blob/73a415f/frontend/scripts/check-parity.mjs\">Parity check\u003c/a>\u003c/p>\n\u003c/article>\u003c/section>\n\u003c/main>\n\u003c/div>\n\n\u003cscript>\nconst views = new Map([...document.querySelectorAll('.route-view')].map(view => [view.id, view]));\nconst nav = document.getElementById('release-nav');\nconst menu = document.getElementById('menu-button');\nlet active = null;\nlet ticketFrom = 'tickets';\n\n\nfunction renderRoute() {\n  const route = location.hash.slice(1);\n  const next = views.get(route) || views.get('overview');\n  if (next === active) return;\n  if (next.id.startsWith('ticket-') && active && !active.id.startsWith('ticket-')) {\n    ticketFrom = active.id;\n  }\n  const hadActiveView = Boolean(active);\n  for (const view of views.values()) view.hidden = view !== next;\n  active = next;\n  const heading = next.querySelector('h1');\n  if (hadActiveView) {\n    heading.tabIndex = -1;\n    heading.focus({preventScroll:true});\n  }\n  window.scrollTo(0,0);\n  requestAnimationFrame(() => window.scrollTo(0,0));\n  document.title = next.id === 'overview' ? '22 Nov Driver App Release' :\n    heading.textContent + ' \u00b7 22 Nov Driver App Release';\n  const navId = next.id.startsWith('ticket-') ? 'tickets' : next.id;\n  for (const link of nav.querySelectorAll('a')) {\n    if (link.hash === '#' + navId) link.setAttribute('aria-current','page');\n    else link.removeAttribute('aria-current');\n  }\n  const back = next.querySelector('.return-link');\n  if (back) {\n    back.href = '#' + ticketFrom;\n    back.textContent = ticketFrom === 'tickets' ? '\u2190 All tickets' : '\u2190 Back';\n  }\n  menu.setAttribute('aria-expanded','false');\n  nav.removeAttribute('data-open');\n}\nwindow.addEventListener('hashchange',renderRoute);\nmenu.addEventListener('click',() => {\n  const open = nav.toggleAttribute('data-open');\n  menu.setAttribute('aria-expanded', String(open));\n});\nnav.addEventListener('click',event => {\n  if (event.target.closest('a')) {\n    menu.setAttribute('aria-expanded','false');\n    nav.removeAttribute('data-open');\n  }\n});\nrenderRoute();\n\nconst search = document.getElementById('ticket-search');\nconst list = [...document.querySelectorAll('#ticket-list a')];\nconst result = document.getElementById('ticket-result');\nsearch.addEventListener('input', () => {\n  const query = search.value.trim().toLowerCase();\n  let matches = 0;\n  for (const link of list) {\n    link.hidden = !link.textContent.toLowerCase().includes(query);\n    if (!link.hidden) matches++;\n  }\n  result.textContent = query ? matches + ' matching tickets' : '';\n});\nfor (const button of document.querySelectorAll('.copy-ticket')) {\n  button.addEventListener('click',async () => {\n    const view = button.closest('.route-view');\n    const ticket = view.querySelector('.ticket');\n    const text = [ticket.dataset.title,...Array.from(ticket.children).map(element => element.innerText.trim())].join('\\n\\n');\n    try {\n      await navigator.clipboard.writeText(text);\n      button.textContent = 'Copied';\n    } catch {\n      const range = document.createRange();\n      range.selectNodeContents(ticket);\n      const selection = getSelection();\n      selection.removeAllRanges();\n      selection.addRange(range);\n      button.textContent = 'Selected \u00b7 press Copy';\n    }\n  });\n}\n\u003c/script>\n\u003c/body>\n\u003c/html>\n";
