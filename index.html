<style>
:root{color-scheme:light;--ink:#111827;--muted:#4b5563;--line:#e3e7ef;--bg:#f6f7fb;--white:#fff;--brand:#1f3fbf;--brand-dark:#142952;--mint:#eaf0ff;--radius:12px}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}a{color:var(--brand);text-underline-offset:.18em}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{cursor:wait;opacity:.65}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #3557e6;outline-offset:2px}h1,h2,h3,p{margin:0}h1{font-size:clamp(2rem,4vw,3rem);letter-spacing:-.055em;line-height:1.1}h2{font-size:1.25rem}h3{font-size:1rem} [hidden]{display:none!important}
.workspace{display:grid;grid-template-columns:205px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;gap:22px;padding:23px 14px;background:var(--brand-dark);color:white;overflow-y:auto}
.brand{display:inline-flex;align-items:center;gap:.65rem;color:white;text-decoration:none;font-size:1.2rem;font-weight:750;white-space:nowrap;padding:0 .5rem}.mark{width:2rem;height:2rem;display:grid;place-items:center;background:#eaf0ff;color:#142952;border-radius:8px}
.sidebar nav{display:grid;gap:.35rem}.sidebar nav a{display:block;color:#e3ebff;text-decoration:none;border-radius:8px;font-weight:650;padding:.65rem .75rem}.sidebar nav a:hover{background:#253f6f}.sidebar nav a[aria-current]{color:#182f69;background:#eaf0ff}
.menu-toggle{display:none!important}.account{margin-top:auto;display:grid;justify-items:start;gap:.6rem;padding:.3rem .45rem}.account span{font-size:.88rem;color:#e4edff;overflow-wrap:anywhere}.account button{border-color:#7890ba;color:white;background:transparent}.account button:hover{background:#253f6f}

main{min-width:0;width:100%;max-width:1540px;margin:0 auto;padding:clamp(18px,4vw,52px)}.heading{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:24px}.heading p{color:var(--muted);margin:.45rem 0}.toolbar,.actions,.tags{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}.toolbar{margin-bottom:20px}.toolbar input{width:min(300px,100%)}.toolbar select{min-width:145px}.toolbar .push{margin-left:auto}.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:white;border-radius:8px;min-height:40px;padding:.45rem .75rem;font-weight:650;font-size:.9rem}.btn:hover{background:#eaf0ff}.primary{background:var(--brand);color:white;border-color:var(--brand)}.primary:hover{background:#173095}.field{width:100%;border:1px solid #c9d0dc;background:white;border-radius:8px;padding:.48rem .65rem;color:var(--ink);min-height:40px}textarea.field{min-height:105px;resize:vertical}
.board{display:grid;grid-template-columns:repeat(4,minmax(215px,1fr));gap:14px;overflow-x:auto;padding-bottom:8px}.lane{background:#f0f3f9;border:1px solid #e3e7ef;border-radius:var(--radius);padding:.7rem;min-height:360px}.lane-head{display:flex;align-items:center;gap:.55rem;margin-bottom:.75rem;min-height:31px}.lane-head .add{margin-left:auto;min-height:28px;width:30px;padding:0}.dot{width:.62rem;height:.62rem;border-radius:50%;background:#6e8278;display:inline-block}.lane[data-status="In Progress"] .dot{background:#3473a7}.lane[data-status="In Review"] .dot{background:#b6792c}.lane[data-status="Done"] .dot{background:#21845d}.count,.tag{font-size:.78rem;font-weight:700;border-radius:20px;background:#e9eef9;padding:.12rem .48rem;color:#34476b;white-space:nowrap}.tag.high{background:#ffeadf;color:#8b4224}.tag.scope{background:#eaf0ff;color:#1f3fbf}.task{display:block;background:white;border:1px solid var(--line);border-radius:10px;padding:.8rem;margin:.55rem 0;text-decoration:none;color:var(--ink)}.task:hover{border-color:#3557e6;background:#f7faff}.task h3{margin-bottom:.42rem}.task-foot{display:flex;align-items:center;justify-content:space-between;gap:.5rem;margin-top:.85rem;color:var(--muted);font-size:.8rem}.avatar{width:27px;height:27px;border-radius:50%;display:inline-grid;place-items:center;background:#e0eaff;color:#213c78;font-size:.72rem;font-weight:750;flex:none}.person{display:inline-flex;align-items:center;gap:.36rem;min-width:0}.truncated{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.empty,.hint{color:var(--muted);font-size:.9rem}.empty{padding:.8rem .2rem}.panel{border:1px solid var(--line);background:white;border-radius:var(--radius);padding:clamp(14px,2vw,24px)}.panel h2{margin-bottom:.7rem}.ticket-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(240px,1fr);align-items:start;gap:16px}.stack{display:grid;gap:14px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}label{display:grid;gap:.3rem;color:#34476b;font-weight:650;font-size:.91rem}label .wide{width:100%}.full{grid-column:1/-1}.form-foot{display:flex;justify-content:flex-end;margin-top:14px;gap:.5rem}.history{list-style:none;padding:0;margin:0;overflow-wrap:anywhere}.history li{padding:.65rem 0;border-top:1px solid var(--line)}.history time{font-size:.78rem;color:var(--muted)}.link-list{display:grid;gap:.5rem;overflow-wrap:anywhere}.back{display:inline-block;margin-bottom:1rem;font-size:.9rem;font-weight:650}.doc-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:12px}.doc-card{text-decoration:none;color:var(--ink);display:grid;gap:.5rem}.doc-card:hover{border-color:#3557e6}.viewer{min-height:68vh;width:100%;border:1px solid var(--line);background:white;border-radius:10px}.markdown{max-width:80ch;overflow-wrap:anywhere}.markdown>*+*{margin-top:.8rem}.markdown code{background:#f0f3f9;padding:.1rem .2rem}.markdown pre{white-space:pre-wrap;background:#f0f3f9;padding:.75rem}dialog{border:1px solid var(--line);border-radius:14px;padding:20px;width:min(500px,calc(100% - 24px));color:var(--ink);max-height:85vh;overflow:auto}dialog::backdrop{background:#172744a0}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:.6rem;margin-bottom:12px}.member-list{list-style:none;padding:0;margin:.65rem 0 1rem}.member-list li{border-bottom:1px solid var(--line);padding:.45rem 0;overflow-wrap:anywhere}#notice:not(:empty){position:fixed;z-index:3;bottom:18px;right:18px;max-width:min(480px,calc(100vw - 36px));background:#142952;color:white;padding:.65rem .9rem;border-radius:8px;box-shadow:0 4px 20px #1429522b}#notice.error{background:#802d21}
@media(max-width:770px){.ticket-grid{grid-template-columns:1fr}.board{grid-template-columns:repeat(4,minmax(240px,1fr))}.toolbar .push{margin-left:0}}
@media(max-width:680px){
.workspace{display:block}
.sidebar{height:auto;position:static;display:grid;grid-template-columns:1fr auto;gap:10px;padding:12px 16px;overflow:visible}
.menu-toggle{display:inline-flex!important}
.sidebar nav{display:none;grid-column:1/-1}.sidebar nav[data-open]{display:grid}
.account{grid-column:1/-1;padding:0 .5rem;display:flex;align-items:center;flex-wrap:wrap}
.account:empty{display:none}
}
@media(max-width:470px){.form-grid{grid-template-columns:1fr}.heading{flex-wrap:wrap}}

.task .tag.scope{max-width:100%;white-space:normal;overflow-wrap:anywhere}
.lane[data-status="In Progress"]{background:#eaf2ff}
.lane[data-status="In Review"]{background:#f8f3eb}
.lane[data-status="Done"]{background:#eaf2e9}

.task-link{display:block;color:inherit;text-decoration:none}
.task-link:hover h3{text-decoration:underline;text-underline-offset:.18em}
.start-task{margin-top:.7rem;min-height:32px;color:var(--brand);background:#eaf0ff;border-color:#cbd8fc}
.archive-task{margin-right:auto;color:#912d24}

.task{position:relative;cursor:grab;user-select:none}
.task-link h3{padding-right:1.45rem}
.drag-handle{position:absolute;top:.65rem;right:.6rem;width:24px;min-height:26px;display:grid;place-items:center;border-radius:5px;background:#eaf0ff;color:var(--brand);font-size:1.15rem;line-height:1;cursor:grab;touch-action:none}
.task.is-dragging{opacity:.3;cursor:grabbing}
.task.drag-ghost{position:fixed;z-index:10;pointer-events:none;margin:0;will-change:transform;border-color:var(--brand);background:white;box-shadow:0 16px 36px #1429523b,0 4px 10px #14295224;animation:task-lift 150ms ease-out both}
@keyframes task-lift{from{scale:1}to{scale:1.035}}
@media(prefers-reduced-motion:reduce){.task.drag-ghost{animation:none}}
.lane.drop-target{outline:2px dashed var(--brand);outline-offset:-3px;background:#e4edff}
main.docs-list-view{padding:16px 18px}
.docs-list-view .heading{margin-bottom:12px}
.docs-list-view .heading h1{font-size:1.75rem}
.docs-list-view .doc-card{padding:12px 14px;gap:.35rem}
.workspace.document-open{display:block}
.workspace.document-open > .sidebar{display:none}
main.doc-view{padding:0;max-width:none;margin:0}
.doc-toolbar{height:44px;position:sticky;top:0;z-index:1;display:flex;align-items:center;padding:4px 8px;background:white;border-bottom:1px solid var(--line)}
.doc-toolbar .btn{min-height:32px;padding:.25rem .6rem}
.doc-view .viewer{display:block;width:100%;height:calc(100dvh - 44px);min-height:0;border:0;border-radius:0}
.doc-view #file-view{border-radius:0;border:0;padding:12px 16px}

</style>

f; color:#142952; font-weight:750; }\n.mobile-control { display:none; }\nmain { min-width:0; max-width:1200px; width:100%; margin-inline:auto; padding:clamp(20px,4.7vw,58px); }\n.page-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:1rem; margin:0 0 1.55rem; }\n.page-heading p { color:var(--muted); margin:0; max-width:63ch; }\n.release-summary { display:flex; align-items:flex-end; justify-content:space-between; gap:1.2rem; padding:clamp(16px,3vw,28px); background:var(--wash); border:1px solid #d4dfff; border-radius:15px; }\n.release-summary p { max-width:63ch; margin-bottom:0; }\n.status-chip { display:inline-block; color:#70431b; background:#f9ead7; border-radius:100px; padding:.22rem .68rem; margin-bottom:.65rem; font-size:.8rem; font-weight:750; }\n.primary, .copy-ticket { display:inline-flex; align-items:center; gap:.5rem; border:0; border-radius:8px; padding:.58rem .9rem; color:white; background:var(--accent); font:inherit; font-size:.9rem; font-weight:700; text-decoration:none; white-space:nowrap; cursor:pointer; }\n.primary:hover,.copy-ticket:hover { background:var(--accent-dark); }\n.overview-section { margin-top:1.8rem; }\n.role-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:.85rem; }\n.role-card { display:flex; flex-direction:column; background:var(--paper); border:1px solid var(--edge); border-radius:12px; padding:1rem 1.1rem; text-decoration:none; color:var(--ink); }\n.role-card strong { font-size:1.12rem; } .role-card p { color:var(--muted); }\n.jump-label { margin-top:auto; color:var(--accent); font-weight:700; font-size:.88rem; }\n.role-card:hover, .resource-list a:hover { background:#f2f6ff; border-color:#8197db; }\n.resource-list { display:grid; gap:.4rem; }\n.resource-list a { display:flex; align-items:center; justify-content:space-between; gap:1rem; background:var(--paper); color:var(--ink); border:1px solid var(--edge); padding:.65rem .9rem; border-radius:8px; text-decoration:none; }\n.resource-list small { display:block; color:var(--muted); }\n.release-refs { margin-top:1.7rem; color:var(--muted); font-size:.88rem; }\n.route-view > section + section { margin-top:1.6rem; }\n.panel, article { background:var(--paper); border:1px solid var(--edge); padding:1rem 1.15rem; border-radius:12px; margin:0 0 1rem; }\n.panel h4,article h4,.flow,.work-label,.view { color:var(--accent); }\n.flow,.work-label { font-weight:700; }\n.grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:6px 24px; }\n.done { background:var(--wash); padding:.65rem .85rem; border-radius:7px; }\n.meta,.refs { color:var(--muted); font-size:.88rem; }\n.ticket-nav { margin-bottom:.65rem; }\n.return-link,.ticket-link { display:inline-block; font-weight:700; font-size:.92rem; }\n.ticket-link::after { content:\" \u2192\"; }\n.table-scroll { overflow-x:auto; border:1px solid var(--edge); border-radius:10px; background:white; }\ntable { width:100%; min-width:610px; border-collapse:collapse; text-align:left; font-size:.92rem; }\nth,td { vertical-align:top; padding:.64rem .75rem; border-bottom:1px solid var(--edge); }\nth { background:#eaf0ff; }\ntr:last-child td { border-bottom:0; }\n.ticket-index label { display:block; font-weight:700; margin-bottom:.35rem; }\n.ticket-index input { background:white; color:var(--ink); width:min(100%,440px); padding:.62rem .75rem; border:1px solid #9cb1a8; border-radius:8px; font:inherit; }\n.search-result { margin:.5rem 0; color:var(--muted); font-size:.88rem; }\n@media(max-width:920px) {\n .shell { grid-template-columns:190px minmax(0,1fr); }\n .sidebar { padding:18px 12px; }\n .release-summary { align-items:flex-start; flex-direction:column; }\n}\n@media(max-width:680px) {\n .shell { display:block; }\n .sidebar { min-height:0; max-height:none; position:static; overflow:visible; display:grid; grid-template-columns:1fr auto; align-items:center; }\n .mobile-control { display:inline-block; color:white; font:inherit; border:1px solid #a8c5b8; border-radius:7px; background:transparent; padding:.3rem .64rem; }\n #release-nav { display:none; grid-column:1 / -1; }\n #release-nav[data-open] { display:block; }\n .grid,.role-grid { grid-template-columns:1fr; } .page-heading { flex-wrap:wrap; }\n}\n@media print {\n .shell { display:block; } .sidebar,.copy-ticket,.ticket-nav,.primary { display:none; }\n main { max-width:none; padding:0; } .panel,article,tr { break-inside:avoid; }\n}\n\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"shell\">\n\u003caside class=\"sidebar\">\n\u003ca href=\"#overview\" class=\"brand\">Driver App\u003csmall>22 Nov Release\u003c/small>\u003c/a>\n\u003cbutton id=\"menu-button\" class=\"mobile-control\" type=\"button\" aria-expanded=\"false\" aria-controls=\"release-nav\">Menu\u003c/button>\n\u003cnav id=\"release-nav\" aria-label=\"Release navigation\">\n\u003cdiv class=\"nav-group\">\u003cp>Release\u003c/p>\u003ca class=\"nav-link\" href=\"#overview\">Release overview\u003c/a>\u003c/div>\n\u003cdiv class=\"nav-group\">\u003cp>App views\u003c/p>\u003ca class=\"nav-link\" href=\"#driver\">Driver\u003c/a>\u003ca class=\"nav-link\" href=\"#field-agent\">Field Agent\u003c/a>\u003ca class=\"nav-link\" href=\"#manager\">Manager\u003c/a>\u003ca class=\"nav-link\" href=\"#owner\">Owner\u003c/a>\u003c/div>\n\u003cdiv class=\"nav-group\">\u003cp>Work\u003c/p>\u003ca class=\"nav-link\" href=\"#screen-map\">Screen tracker\u003c/a>\u003ca class=\"nav-link\" href=\"#status\">Feature status\u003c/a>\u003ca class=\"nav-link\" href=\"#tickets\">Tickets\u003c/a>\u003ca class=\"nav-link\" href=\"#branches\">Release branches\u003c/a>\u003c/div>\n\u003cdiv class=\"nav-group\">\u003cp>Validation\u003c/p>\u003ca class=\"nav-link\" href=\"#end-to-end\">End-to-end sign-off\u003c/a>\u003ca class=\"nav-link\" href=\"#qa\">QA evidence\u003c/a>\u003ca class=\"nav-link\" href=\"#phase-2\">Phase 2 \u00b7 Navigation\u003c/a>\u003c/div>\n\u003c/nav>\n\u003c/aside>\n\u003cmain id=\"main-content\">\n\u003csection id=\"overview\" class=\"route-view\">\n\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>22 Nov Driver App Release\u003c/h1>\u003cp>Phase 1 ka scope, screen-wise pending work aur sign-off.\u003c/p>\u003c/div>\u003c/header>\n\u003cdiv class=\"release-summary\">\n  \u003cdiv>\u003cspan class=\"status-chip\">Sign-off pending\u003c/span>\u003ch2>Phase 1 navigation ke bina ship ho sakta hai\u003c/h2>\u003cp>Core APIs aur app screens available hain. Mobile wiring, backend gaps aur device/pilot proof baaki hai. Navigation ka scope Phase 2 mein hai.\u003c/p>\u003c/div>\n  \u003ca class=\"primary\" href=\"#end-to-end\">Open sign-off checklist \u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\n\u003c/div>\n\u003csection class=\"overview-section\">\n  \u003ch2>App views\u003c/h2>\n  \u003cdiv class=\"role-grid\">\n    \u003ca class=\"role-card\" href=\"#driver\">\u003cstrong>Driver\u003c/strong>\u003cp>Trip, crew, papers, Wallet aur road alerts\u003c/p>\u003cspan class=\"jump-label\">Open view \u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/span>\u003c/a>\u003ca class=\"role-card\" href=\"#field-agent\">\u003cstrong>Field Agent\u003c/strong>\u003cp>Org, vehicle aur fuel capture\u003c/p>\u003cspan class=\"jump-label\">Open view \u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/span>\u003c/a>\u003ca class=\"role-card\" href=\"#manager\">\u003cstrong>Manager\u003c/strong>\u003cp>Fleet, evidence aur action cards\u003c/p>\u003cspan class=\"jump-label\">Open view \u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/span>\u003c/a>\u003ca class=\"role-card\" href=\"#owner\">\u003cstrong>Owner\u003c/strong>\u003cp>Reports, paper review, bills aur settings\u003c/p>\u003cspan class=\"jump-label\">Open view \u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/span>\u003c/a>\n  \u003c/div>\n\u003c/section>\n\u003csection class=\"overview-section\">\n  \u003ch2>Release work\u003c/h2>\n  \u003cdiv class=\"resource-list\">\n    \u003ca href=\"#screen-map\">\u003cspan>\u003cstrong>Screen tracker\u003c/strong>\u003csmall>16 screen entries \u00b7 Kahan aur kya change chahiye\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\n    \u003ca href=\"#status\">\u003cspan>\u003cstrong>Feature status\u003c/strong>\u003csmall>Backend ready, mobile pending aur dono ka work\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\n    \u003ca href=\"#tickets\">\u003cspan>\u003cstrong>Tickets\u003c/strong>\u003csmall>11 copyable feature and QA tickets\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\n    \u003ca href=\"#branches\">\u003cspan>\u003cstrong>Release branches\u003c/strong>\u003csmall>Included backend patches aur mobile references\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\n    \u003ca href=\"#qa\">\u003cspan>\u003cstrong>QA evidence\u003c/strong>\u003csmall>Passed tests, device drills aur rollout checks\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\n    \u003ca href=\"#phase-2\">\u003cspan>\u003cstrong>Phase 2 \u00b7 Navigation\u003c/strong>\u003csmall>Truck routing, guidance, offline maps aur learned ETA\u003c/small>\u003c/span>\u003cspan aria-hidden=\"true\">\u2192\u003c/span>\u003c/a>\n  \u003c/div>\n\u003c/section>\n\u003cp class=\"release-refs\">Backend \u003ccode>release/en-24-nov-backend @ 77d257c5\u003c/code>\u003cbr>Mobile \u003ccode>release/en-24-nov-driver-app @ 73a415f\u003c/code>\u003c/p>\u003c/section>\n\u003csection id=\"driver\" class=\"route-view\" hidden>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>Driver\u003c/h1>\u003cp>Trip, crew, papers, Wallet aur road alerts\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"panel\" aria-label=\"Driver app overview\">\n\u003ch2>App abhi kaise chalti hai\u003c/h2>\n\u003cp class=\"flow\">Login \u2192 truck pairing \u2192 Trips / Inbox / More \u2192 fuel, documents ya help\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Kya done hai\u003c/h4>\u003cp>Truck assignment, past GPS trips, fuel entry, document upload, manual stop reasons, SOS, messages aur handover ke screens available hain.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Kitna bacha hai\u003c/h4>\u003cp>Offline login recovery, Wallet, two-phone prompts, plant push aur paper review ka result driver tak pahunchana baaki hai.\u003c/p>\u003c/div>\n\u003c/div>\n\u003ch4>Kya improve karna hai\u003c/h4>\u003cp>Capture mein status aur retake reason clear rakho. Offline retries same request se chalni chahiye. Moving driver ke prompts short aur safe rakho.\u003c/p>\n\u003c/section>\n\u003csection aria-label=\"Driver tickets\">\n\u003ch2>Feature tickets\u003c/h2>\n\u003carticle>\n\u003ch3>01 API version aur CI\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Version guard aur manifest hain. Release compatibility aur required CI coverage baaki.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Actual build version bhejna aur 426 handling.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-api\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>02 Refresh aur GPS queue\u003c/h3>\n\u003cp class=\"work-label\">Mainly mobile\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Refresh, revocation aur batch APIs ready. Duty/consent signal verify karna hai.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Foreground/background refresh, queue replay aur tracking stop.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-session\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>03B Universal capture aur retake\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 OCR, hashing aur intake hain. Driver scope aur review lifecycle jodna hai.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 V2 capture, retake, reviewer actions aur driver status.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-papers\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>04 Reimbursement aur wallet\u003c/h3>\n\u003cp class=\"work-label\">Dono \u00b7 mainly mobile\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Bill aur ledger APIs hain. Retry, review concurrency aur settlement contract verify/harden karna hai.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Wallet, Add Bill aur decision status active stack mein.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-wallet\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>05 Crew handover aur duty\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Core handover and duty APIs hain. Owner crew declaration APIs release mein hain. Fuel/score attribution baaki.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Two-phone prompts, break plan aur owner crew UI.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-crew\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>06 Plant entry/exit\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Visit state machine aur push code hain. Live GPS producer wiring baaki.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Push tap se correct site card kholna.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-plant\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>07 Road reports aur prompts\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Report/prompt APIs hain. Fresh fix, stable retry aur policy integration baaki.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Nearby feed, Still there? aur safe 10-second prompt.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-road\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>08 Manager cards aur driver help\u003c/h3>\n\u003cp class=\"work-label\">Dono \u00b7 mainly mobile\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Action APIs hain. Driver reply aur same-card linkage verify karni hai.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Call result, handled, snooze aur reply wiring.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-office\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>09E Paper evidence aur reminders\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Taxonomy, bill pairing aur evidence readers hain. Per-type cross-check aur accuracy proof baaki.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Disagreement, expiry aur actionable retake screens.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-evidence\">Open detailed ticket\u003c/a>\n\u003c/article>\n\u003c/section>\u003c/section>\n\u003csection id=\"field-agent\" class=\"route-view\" hidden>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>Field Agent\u003c/h1>\u003cp>Org, vehicle aur fuel capture\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"panel\" aria-label=\"Field Agent app overview\">\n\u003ch2>App abhi kaise chalti hai\u003c/h2>\n\u003cp class=\"flow\">Login \u2192 Orgs \u2192 vehicle select \u2192 fuel capture \u2192 Profile\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Kya done hai\u003c/h4>\u003cp>Org membership selection, scoped vehicle picker aur fuel submission available hain. Parity check org switch aur truck-bound scope cover karta hai.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Kitna bacha hai\u003c/h4>\u003cp>Is view ka main pending item device verification hai. Org switch, eligible vehicle aur real fuel submit test karo. V2 document capture API available hai, mobile adoption capture ticket mein tracked hai.\u003c/p>\u003c/div>\n\u003c/div>\n\u003ch4>Kya improve karna hai\u003c/h4>\u003cp>Org switch ke baad current org aur allowed vehicle clearly dikhao. Upload failure aur retry state device par check karo.\u003c/p>\n\u003c/section>\n\u003csection aria-label=\"Field Agent tickets\">\n\u003ch2>Feature tickets\u003c/h2>\n\u003carticle>\n\u003ch3>Field Agent org aur fuel flow\u003c/h3>\n\u003cp class=\"work-label\">QA\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Org membership, vehicle scope aur fuel submission available hain.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Org switch \u2192 vehicle select \u2192 fuel submit ka device check.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-field-agent\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>01 API version aur CI\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Version guard aur manifest hain. Release compatibility aur required CI coverage baaki.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Actual build version bhejna aur 426 handling.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-api\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>03B Universal capture aur retake\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 OCR, hashing aur intake hain. Driver scope aur review lifecycle jodna hai.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 V2 capture, retake, reviewer actions aur driver status.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-papers\">Open detailed ticket\u003c/a>\n\u003c/article>\n\u003c/section>\u003c/section>\n\u003csection id=\"manager\" class=\"route-view\" hidden>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>Manager\u003c/h1>\u003cp>Fleet, evidence aur action cards\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"panel\" aria-label=\"Manager app overview\">\n\u003ch2>App abhi kaise chalti hai\u003c/h2>\n\u003cp class=\"flow\">Login \u2192 fleet/map ya action cards \u2192 evidence \u2192 call ya message\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Kya done hai\u003c/h4>\u003cp>Fleet/trip views, manager card list, card evidence aur driver/vehicle detail links available hain.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Kitna bacha hai\u003c/h4>\u003cp>Call outcome, handled, snooze aur card-linked driver reply complete karna hai. Crew handover ke effect ko history mein verify karna hai.\u003c/p>\u003c/div>\n\u003c/div>\n\u003ch4>Kya improve karna hai\u003c/h4>\u003cp>Har card par action, result aur driver ka reply ek jagah dikhao. Act-rate se pata chalega kaunse cards useful hain.\u003c/p>\n\u003c/section>\n\u003csection aria-label=\"Manager tickets\">\n\u003ch2>Feature tickets\u003c/h2>\n\u003carticle>\n\u003ch3>08 Manager cards aur driver help\u003c/h3>\n\u003cp class=\"work-label\">Dono \u00b7 mainly mobile\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Action APIs hain. Driver reply aur same-card linkage verify karni hai.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Call result, handled, snooze aur reply wiring.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-office\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>05 Crew handover aur duty\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Core handover and duty APIs hain. Owner crew declaration APIs release mein hain. Fuel/score attribution baaki.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Two-phone prompts, break plan aur owner crew UI.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-crew\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>01 API version aur CI\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Version guard aur manifest hain. Release compatibility aur required CI coverage baaki.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Actual build version bhejna aur 426 handling.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-api\">Open detailed ticket\u003c/a>\n\u003c/article>\n\u003c/section>\u003c/section>\n\u003csection id=\"owner\" class=\"route-view\" hidden>\u003cheader class=\"page-heading\">\u003cdiv>\u003ch1>Owner\u003c/h1>\u003cp>Reports, paper review, bills aur settings\u003c/p>\u003c/div>\u003c/header>\u003csection class=\"panel\" aria-label=\"Owner app overview\">\n\u003ch2>App abhi kaise chalti hai\u003c/h2>\n\u003cp class=\"flow\">Login \u2192 Today report \u2192 drilldown / messages \u2192 papers, fleet aur team\u003c/p>\n\u003cdiv class=\"grid\">\n\u003cdiv>\u003ch4>Kya done hai\u003c/h4>\u003cp>Daily report, messaging, voice notes, broadcast receipts, fleet aur team access available hain. Backend release mein new paper-review route, promises, cost closure aur report distribution contracts hain.\u003c/p>\u003c/div>\n\u003cdiv>\u003ch4>Kitna bacha hai\u003c/h4>\u003cp>Paper-review mobile route, retake and reimbursement status, promise/history, trip-cost screens aur audience/settings UI baaki hain.\u003c/p>\u003c/div>\n\u003c/div>\n\u003ch4>Kya improve karna hai\u003c/h4>\u003cp>Reports mein source evidence aur missing-data state visible rakho. Bill approved aur payment settled ko alag dikhana hai.\u003c/p>\n\u003c/section>\n\u003csection aria-label=\"Owner tickets\">\n\u003ch2>Feature tickets\u003c/h2>\n\u003carticle>\n\u003ch3>03A Owner paper review queue\u003c/h3>\n\u003cp class=\"work-label\">Mobile\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Release branch mein route aur match order fix.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Queue call ko /captures/review par le jaana.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-papers\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>03B Universal capture aur retake\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 OCR, hashing aur intake hain. Driver scope aur review lifecycle jodna hai.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 V2 capture, retake, reviewer actions aur driver status.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-papers\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>04 Reimbursement aur wallet\u003c/h3>\n\u003cp class=\"work-label\">Dono \u00b7 mainly mobile\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Bill aur ledger APIs hain. Retry, review concurrency aur settlement contract verify/harden karna hai.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Wallet, Add Bill aur decision status active stack mein.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-wallet\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>09A Arrival promise\u003c/h3>\n\u003cp class=\"work-label\">Mobile\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Versioned promise API aur on-time reporting release branch mein.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Promise form, version history aur drilldown.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-followup\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>09B Trip costs aur margin\u003c/h3>\n\u003cp class=\"work-label\">Mobile + data QA\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Cost-closure API aur margin readers release branch mein. Source reconciliation proof baaki.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Trip-cost form, evidence aur margin detail.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-followup\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>09C Report distribution\u003c/h3>\n\u003cp class=\"work-label\">Mobile + release setup\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Email/WhatsApp preference aur delivery-history code release branch mein. Provider setup baaki.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Channel opt-ins, history aur error states.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-followup\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>09D Crew/plant/lane audiences\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Target/member APIs release branch mein. Live plant/lane membership ko source evidence chahiye.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Audience picker aur recipient preview.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-followup\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>09E Paper evidence aur reminders\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Taxonomy, bill pairing aur evidence readers hain. Per-type cross-check aur accuracy proof baaki.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Disagreement, expiry aur actionable retake screens.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-evidence\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>05 Crew handover aur duty\u003c/h3>\n\u003cp class=\"work-label\">Dono\u003c/p>\n\u003cp>\u003cstrong>Backend\u003c/strong> \u00b7 Core handover and duty APIs hain. Owner crew declaration APIs release mein hain. Fuel/score attribution baaki.\u003c/p>\n\u003cp>\u003cstrong>Mobile mein bacha\u003c/strong> \u00b7 Two-phone prompts, break plan aur owner crew UI.\u003c/p>\n\u003ca class=\"ticket-link\" href=\"#ticket-crew\">Open detailed ticket\u003c/a>\n\u003c/article>\u003carticle>\n\u003ch3>01 API version aur CI\u003c/h3>\n\u 003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Driver\u003c/td>\u003ctd>Crew &amp; driving / Rest &amp; hours\u003c/td>\u003ctd>Manual handover aur rest screen available.\u003c/td>\u003ctd>Both phones par safe question, break plan aur handed-over stint ki attribution.\u003c/td>\u003ctd>\u003ca href=\"#ticket-crew\">Open ticket\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Driver\u003c/td>\u003ctd>Site card / notifications\u003c/td>\u003ctd>Site-card reader available.\u003c/td>\u003ctd>GPS visit events se push aur correct site card/papers open karna.\u003c/td>\u003ctd>\u003ca href=\"#ticket-plant\">Open ticket\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Driver\u003c/td>\u003ctd>Road report / Inbox / prompt\u003c/td>\u003ctd>Road report submit aur stop notes available.\u003c/td>\u003ctd>Nearby hazards, retry, Still there?, dismiss/timeout aur safe 10-second shared prompt.\u003c/td>\u003ctd>\u003ca href=\"#ticket-road\">Open ticket\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Driver\u003c/td>\u003ctd>Help / Helpful cards\u003c/td>\u003ctd>Help aur contact options available.\u003c/td>\u003ctd>Card-specific reply aur action result connect karna.\u003c/td>\u003ctd>\u003ca href=\"#ticket-office\">Open ticket\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Field Agent\u003c/td>\u003ctd>Orgs / Vehicle Picker / Fuel form\u003c/td>\u003ctd>Org selection, scoped truck selection aur fuel submit active.\u003c/td>\u003ctd>Release-device check with org switching, allowed truck and retry. Universal capture ka extra mobile scope alag se confirm karo.\u003c/td>\u003ctd>\u003ca href=\"#ticket-field-agent\">Open ticket\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Manager\u003c/td>\u003ctd>Home card list / Manager action detail\u003c/td>\u003ctd>Ranked cards, evidence aur detail links available.\u003c/td>\u003ctd>Call outcome, Handled, Snooze aur driver reply same card mein.\u003c/td>\u003ctd>\u003ca href=\"#ticket-office\">Open ticket\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Manager\u003c/td>\u003ctd>Fleet / Vehicle detail / Crew history\u003c/td>\u003ctd>Fleet paths aur crew history available.\u003c/td>\u003ctd>Two-driver handover ke baad duty, fuel aur score evidence flow verify karna.\u003c/td>\u003ctd>\u003ca href=\"#ticket-crew\">Open ticket\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Owner\u003c/td>\u003ctd>More \u2192 Capture reviews / Owner record\u003c/td>\u003ctd>Owner API route release par verified.\u003c/td>\u003ctd>Mobile queue call new route par, extraction correction aur driver-facing retake/reject lifecycle.\u003c/td>\u003ctd>\u003ca href=\"#ticket-papers\">Open ticket\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Owner\u003c/td>\u003ctd>Pending bill review / finance\u003c/td>\u003ctd>Bill confirmation, rejection aur wallet service available.\u003c/td>\u003ctd>Bill decision from review queue, branch scope, proof of single credit and settlement.\u003c/td>\u003ctd>\u003ca href=\"#ticket-wallet\">Open ticket\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Owner\u003c/td>\u003ctd>Today / Report drilldowns / Trip costs\u003c/td>\u003ctd>Daily report active. Follow-up finance and promise APIs release mein.\u003c/td>\u003ctd>Arrival promise + history, cost closure, margin detail aur source reconciliation.\u003c/td>\u003ctd>\u003ca href=\"#ticket-followup\">Open ticket\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Owner\u003c/td>\u003ctd>Messages / Broadcasts / Report settings\u003c/td>\u003ctd>Messages and receipts active. Additional audiences and delivery APIs available.\u003c/td>\u003ctd>Crew/plant/lane recipient preview, opt-ins aur delivery history.\u003c/td>\u003ctd>\u003ca href=\"#ticket-followup\">Open ticket\u003c/a>\u003c/td>\u003c/tr>\n\u003ctr>\u003ctd>Owner + Driver\u003c/td>\u003ctd>Documents / reminders / evidence\u003c/td>\u003ctd>Taxonomy, capture evidence aur reminder list available.\u003c/td>\u003ctd>Side-by-side evidence, expiry and retake actions, per-type accuracy proof.\u003c/td>\u003ctd>\u
